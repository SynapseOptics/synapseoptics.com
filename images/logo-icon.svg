<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="nodeGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%"   stop-color="#5DCAA5"/>
      <stop offset="100%" stop-color="#0F6E56"/>
    </radialGradient>
    <radialGradient id="iconFocal" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#BA7517"/>
      <stop offset="60%"  stop-color="#EF9F27" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#EF9F27" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- White background -->
  <rect width="200" height="200" fill="#ffffff"/>

  <!-- Circle badge -->
  <circle cx="100" cy="100" r="90" fill="#E1F5EE" opacity="0.6"/>
  <circle cx="100" cy="100" r="90" fill="none" stroke="#1D9E75" stroke-width="1.2" opacity="0.4"/>

  <!-- Incoming rays -->
  <line x1="24"  y1="88"  x2="64"  y2="88"  stroke="#5DCAA5" stroke-width="1.4" opacity="0.8"/>
  <line x1="24"  y1="100" x2="64"  y2="100" stroke="#5DCAA5" stroke-width="2"   opacity="0.9"/>
  <line x1="24"  y1="112" x2="64"  y2="112" stroke="#5DCAA5" stroke-width="1.4" opacity="0.8"/>

  <!-- Lens -->
  <path d="M100 68 Q68 84 68 100 Q68 116 100 132" fill="none" stroke="#1D9E75" stroke-width="2" opacity="0.9"/>
  <path d="M100 68 Q132 84 132 100 Q132 116 100 132" fill="none" stroke="#1D9E75" stroke-width="2" opacity="0.9"/>
  <path d="M100 74 Q82 88 82 100" fill="none" stroke="#5DCAA5" stroke-width="0.8" opacity="0.35"/>

  <!-- Refracted rays -->
  <line x1="132" y1="88"  x2="168" y2="100" stroke="#5DCAA5" stroke-width="1.4" opacity="0.75"/>
  <line x1="132" y1="100" x2="168" y2="100" stroke="#5DCAA5" stroke-width="2"   opacity="0.85"/>
  <line x1="132" y1="112" x2="168" y2="100" stroke="#5DCAA5" stroke-width="1.4" opacity="0.75"/>

  <!-- Focal point -->
  <circle cx="168" cy="100" r="14" fill="url(#iconFocal)" opacity="0.5"/>
  <circle cx="168" cy="100" r="6"  fill="url(#iconFocal)" opacity="0.7"/>
  <circle cx="168" cy="100" r="3.5" fill="#BA7517"/>
</svg>
