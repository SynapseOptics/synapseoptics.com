<svg width="680" height="340" viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="lensGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#1D9E75" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#1D9E75" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="focalWarm" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#BA7517" stop-opacity="1"/>
      <stop offset="55%"  stop-color="#EF9F27" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#EF9F27" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nodeGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%"   stop-color="#5DCAA5"/>
      <stop offset="100%" stop-color="#0F6E56"/>
    </radialGradient>
    <linearGradient id="rayIn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#9FE1CB" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#9FE1CB" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1D9E75" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="rayOut" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#1D9E75" stop-opacity="1"/>
      <stop offset="60%"  stop-color="#9FE1CB" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#EF9F27" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- White background -->
  <rect width="680" height="340" fill="#ffffff"/>

  <!-- Node network — left -->
  <line x1="112" y1="108" x2="154" y2="146" stroke="#0F6E56" stroke-width="0.8" opacity="0.3"/>
  <line x1="112" y1="108" x2="132" y2="80"  stroke="#0F6E56" stroke-width="0.8" opacity="0.3"/>
  <line x1="132" y1="80"  x2="174" y2="92"  stroke="#0F6E56" stroke-width="0.7" opacity="0.25"/>
  <line x1="154" y1="146" x2="174" y2="92"  stroke="#0F6E56" stroke-width="0.7" opacity="0.25"/>
  <line x1="154" y1="146" x2="172" y2="175" stroke="#0F6E56" stroke-width="0.7" opacity="0.25"/>
  <line x1="172" y1="175" x2="194" y2="200" stroke="#0F6E56" stroke-width="0.6" opacity="0.2"/>
  <line x1="174" y1="92"  x2="196" y2="122" stroke="#0F6E56" stroke-width="0.6" opacity="0.2"/>
  <line x1="112" y1="214" x2="154" y2="146" stroke="#0F6E56" stroke-width="0.7" opacity="0.25"/>
  <line x1="112" y1="214" x2="172" y2="175" stroke="#0F6E56" stroke-width="0.6" opacity="0.2"/>
  <circle cx="112" cy="108" r="5"   fill="url(#nodeGrad)" opacity="0.7"/>
  <circle cx="132" cy="80"  r="3.5" fill="url(#nodeGrad)" opacity="0.55"/>
  <circle cx="154" cy="146" r="4.5" fill="url(#nodeGrad)" opacity="0.65"/>
  <circle cx="112" cy="214" r="4"   fill="url(#nodeGrad)" opacity="0.55"/>
  <circle cx="174" cy="92"  r="3.5" fill="url(#nodeGrad)" opacity="0.5"/>
  <circle cx="172" cy="175" r="3.5" fill="url(#nodeGrad)" opacity="0.5"/>
  <circle cx="196" cy="122" r="3"   fill="url(#nodeGrad)" opacity="0.4"/>
  <circle cx="194" cy="200" r="3"   fill="url(#nodeGrad)" opacity="0.4"/>

  <!-- Node network — right -->
  <line x1="568" y1="108" x2="526" y2="146" stroke="#0F6E56" stroke-width="0.8" opacity="0.3"/>
  <line x1="568" y1="108" x2="548" y2="80"  stroke="#0F6E56" stroke-width="0.8" opacity="0.3"/>
  <line x1="548" y1="80"  x2="506" y2="92"  stroke="#0F6E56" stroke-width="0.7" opacity="0.25"/>
  <line x1="526" y1="146" x2="506" y2="92"  stroke="#0F6E56" stroke-width="0.7" opacity="0.25"/>
  <line x1="526" y1="146" x2="508" y2="175" stroke="#0F6E56" stroke-width="0.7" opacity="0.25"/>
  <line x1="508" y1="175" x2="486" y2="200" stroke="#0F6E56" stroke-width="0.6" opacity="0.2"/>
  <line x1="506" y1="92"  x2="484" y2="122" stroke="#0F6E56" stroke-width="0.6" opacity="0.2"/>
  <line x1="568" y1="214" x2="526" y2="146" stroke="#0F6E56" stroke-width="0.7" opacity="0.25"/>
  <line x1="568" y1="214" x2="508" y2="175" stroke="#0F6E56" stroke-width="0.6" opacity="0.2"/>
  <circle cx="568" cy="108" r="5"   fill="url(#nodeGrad)" opacity="0.7"/>
  <circle cx="548" cy="80"  r="3.5" fill="url(#nodeGrad)" opacity="0.55"/>
  <circle cx="526" cy="146" r="4.5" fill="url(#nodeGrad)" opacity="0.65"/>
  <circle cx="568" cy="214" r="4"   fill="url(#nodeGrad)" opacity="0.55"/>
  <circle cx="506" cy="92"  r="3.5" fill="url(#nodeGrad)" opacity="0.5"/>
  <circle cx="508" cy="175" r="3.5" fill="url(#nodeGrad)" opacity="0.5"/>
  <circle cx="484" cy="122" r="3"   fill="url(#nodeGrad)" opacity="0.4"/>
  <circle cx="486" cy="200" r="3"   fill="url(#nodeGrad)" opacity="0.4"/>

  <!-- Incoming rays -->
  <line x1="216" y1="122" x2="310" y2="122" stroke="url(#rayIn)" stroke-width="1.1"/>
  <line x1="216" y1="161" x2="310" y2="161" stroke="url(#rayIn)" stroke-width="1.6"/>
  <line x1="216" y1="200" x2="310" y2="200" stroke="url(#rayIn)" stroke-width="1.1"/>

  <!-- Lens -->
  <ellipse cx="340" cy="161" rx="30" ry="62" fill="url(#lensGlow)"/>
  <path d="M340 99 Q310 130 310 161 Q310 192 340 223" fill="none" stroke="#1D9E75" stroke-width="1.4" opacity="0.9"/>
  <path d="M340 99 Q370 130 370 161 Q370 192 340 223" fill="none" stroke="#1D9E75" stroke-width="1.4" opacity="0.9"/>
  <path d="M340 107 Q324 134 324 161" fill="none" stroke="#5DCAA5" stroke-width="0.6" opacity="0.35"/>
  <line x1="333" y1="161" x2="347" y2="161" stroke="#1D9E75" stroke-width="0.8" opacity="0.5"/>
  <line x1="340" y1="154" x2="340" y2="168" stroke="#1D9E75" stroke-width="0.8" opacity="0.5"/>

  <!-- Refracted rays -->
  <line x1="370" y1="122" x2="450" y2="161" stroke="url(#rayOut)" stroke-width="1.1"/>
  <line x1="370" y1="161" x2="450" y2="161" stroke="url(#rayOut)" stroke-width="1.6"/>
  <line x1="370" y1="200" x2="450" y2="161" stroke="url(#rayOut)" stroke-width="1.1"/>

  <!-- Focal point -->
  <circle cx="450" cy="161" r="20"  fill="url(#focalWarm)" opacity="0.4"/>
  <circle cx="450" cy="161" r="9"   fill="url(#focalWarm)" opacity="0.6"/>
  <circle cx="450" cy="161" r="4.5" fill="#BA7517"/>

  <!-- Rule -->
  <line x1="176" y1="256" x2="504" y2="256" stroke="#1D9E75" stroke-width="0.5" opacity="0.4"/>

  <!-- Wordmark -->
  <text x="340" y="284"
    text-anchor="middle"
    font-family="Optima, 'Palatino Linotype', 'Book Antiqua', serif"
    font-size="30" font-weight="600" letter-spacing="8"
    fill="#085041">SYNAPSE</text>
  <text x="340" y="308"
    text-anchor="middle"
    font-family="Optima, 'Palatino Linotype', 'Book Antiqua', serif"
    font-size="13" font-weight="400" letter-spacing="7"
    fill="#0F6E56" opacity="0.75">OPTICS</text>
</svg>
